<text x="231.35" y="70.00" font-size="7.0" fill="#3A4A51" text-anchor="start" xml:space="preserve">noise, 1.96 SE of the difference</text>
<text x="14.00" y="98.00" font-size="8.6" fill="#14232B" text-anchor="start" xml:space="preserve" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">1  Three borders</text>
<text x="14.00" y="108.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">sleep apnoea, FinnGen R12</text>
<text x="14.00" y="117.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">cases per definition</text>
<text x="139.50" y="98.00" font-size="8.6" fill="#14232B" text-anchor="start" xml:space="preserve" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">2  Five GWAS each</text>
<text x="139.50" y="108.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">LD score regression</text>
<text x="139.50" y="117.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">28 endpoints in all</text>
<text x="265.00" y="98.00" font-size="8.6" fill="#14232B" text-anchor="start" xml:space="preserve" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">3  The rg moves</text>
<text x="265.00" y="108.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">genetic correlation</text>
<text x="265.00" y="117.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">with depression</text>
<text x="390.50" y="98.00" font-size="8.6" fill="#14232B" text-anchor="start" xml:space="preserve" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">4  Beyond its noise?</text>
<text x="390.50" y="108.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">shared-block jackknife</text>
<text x="390.50" y="117.50" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve">difference test</text>
