<text x="14.00" y="35.00" font-size="13.0" fill="#14232B" text-anchor="start" xml:space="preserve" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">Move a condition&#x27;s border in the health record, and ask how far the genetics move</text>
<text x="14.00" y="45.50" font-size="7.2" fill="#5E6E72" text-anchor="start" xml:space="preserve">One worked example with real numbers: sleep apnoea in FinnGen R12 and depression</text>
