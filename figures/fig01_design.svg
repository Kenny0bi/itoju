<text x="23.00" y="268.00" font-size="7.0" fill="#3A4A51" text-anchor="start" xml:space="preserve">published autism heritability and ADHD rg reproduced</text>
<circle cx="268.50" cy="265.50" r="2.00" fill="none" opacity="1.00" stroke="#3A4A51" stroke-width="0.8"/>
<text x="275.00" y="268.00" font-size="7.0" fill="#3A4A51" text-anchor="start" xml:space="preserve">positive control: EHR against clinical depression</text>
<circle cx="16.50" cy="275.50" r="2.00" fill="none" opacity="1.00" stroke="#3A4A51" stroke-width="0.8"/>
<text x="23.00" y="278.00" font-size="7.0" fill="#3A4A51" text-anchor="start" xml:space="preserve">definition codes mapped to SNOMED CT through OMOP</text>
<circle cx="268.50" cy="275.50" r="2.00" fill="none" opacity="1.00" stroke="#3A4A51" stroke-width="0.8"/>
<text x="275.00" y="278.00" font-size="7.0" fill="#3A4A51" text-anchor="start" xml:space="preserve">Finnish against European LD scores</text>
<rect x="14.00" y="292.00" width="492.00" height="38.00" rx="2" fill="#E2EAE7" opacity="1.00"/>
<text x="22.00" y="303.00" font-size="7.0" fill="#5E6E72" text-anchor="start" xml:space="preserve" letter-spacing="1.2">READING THIS</text>
<text x="22.00" y="315.00" font-size="7.2" fill="#14232B" text-anchor="start" xml:space="preserve">Widening sleep apnoea to any sleep disorder moves rg with depression from 0.353 to 0.420.</text>
<text x="22.00" y="325.00" font-size="7.2" fill="#3A4A51" text-anchor="start" xml:space="preserve">Pairing the two estimates block by block keeps the noise to 1.96 SE = 0.014, so p = 2.8e-20.</text>
<text x="506.00" y="344.00" font-size="7.0" fill="#5E6E72" text-anchor="end" xml:space="preserve">FinnGen R12 summary statistics and endpoints; PGC and iPSYCH-PGC GWAS; OMOP vocabularies</text>
