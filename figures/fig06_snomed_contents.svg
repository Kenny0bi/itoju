<text x="22.00" y="383.00" font-size="7.2" fill="#3A4A51" text-anchor="start" xml:space="preserve">Widening sleep apnoea to any sleep disorder adds 16 concepts to the 1 they share.</text>
<text x="22.00" y="393.00" font-size="7.2" fill="#14232B" text-anchor="start" xml:space="preserve">All of K59 adds 13 to constipation&#x27;s 1: a bowel-dysfunction definition, not a constipation one.</text>
<text x="22.00" y="403.00" font-size="7.2" fill="#3A4A51" text-anchor="start" xml:space="preserve">Focal and generalized epilepsy share 0 concepts. Laxative purchases have no condition concept at all.</text>
<text x="506.00" y="426.00" font-size="7.0" fill="#5E6E72" text-anchor="end" xml:space="preserve">OMOP standard vocabularies from Athena; concept IDs published, SNOMED CT content not redistributed</text>
